<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Bevásárlókosár</title>
</head>

<body>
    <nav>
        <a href="index.html">FŐOLDAL</a>
        <a href="robogok.html">ROBOGÓK</a>
        <a href="motorok.html">MOTOR</a>
        <a href="aksik.html">AKKUMULÁTOR</a>
        <a href="kerekek.html">KEREKEK</a>
        <a href="tortenelem.html">TÖRTÉNET</a>
        <a href="contact.html">KAPCSOLAT</a>
        <a href="cart.html">🛒 <span id="cart-count"></span></a>
    </nav>
    <main>
        <h1>Bevásárlókosár</h1>
        <div class="info-box" id="cart-container">
        </div>
    </main>
    <footer>
        <p>&copy; 2026 Elektromos Roller Bolt. Minden jog fenntartva.</p>
    </footer>
    <div id="toast"></div>
    <script src="cart.js"></script>
    <script>
        function escapeHtml(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function removeFromCart(name) {
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            cart = cart.filter(function(item) { return item.name !== name; });
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            if (typeof syncCartWithServer === 'function') {
                syncCartWithServer();
            }
            renderCart();
        }

        function formatPrice(p) {
            return p.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0') + ' Ft';
        }

        function renderCart() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const container = document.getElementById('cart-container');

            if (cart.length === 0) {
                container.innerHTML = '<p style="font-size:22px; text-align:center; padding:40px;">A kosár üres. <a href="index.html" style="color:#4CAF50;">Válogasson termékeink közül!</a></p>';
                return;
            }

            const total = cart.reduce(function(sum, item) { return sum + item.price * item.qty; }, 0);

            let rows = '';
            cart.forEach(function(item) {
                rows += '<tr>'
                    + '<td>' + escapeHtml(item.name) + '</td>'
                    + '<td>' + item.qty + ' db</td>'
                    + '<td>' + formatPrice(item.price) + '</td>'
                    + '<td>' + formatPrice(item.price * item.qty) + '</td>'
                    + '<td><button class="btn-remove" data-name="' + escapeHtml(item.name) + '">Eltávolít</button></td>'
                    + '</tr>';
            });

            container.innerHTML =
                '<table class="cart-table">'
                + '<thead><tr><th>Termék</th><th>Mennyiség</th><th>Egységár</th><th>Összesen</th><th></th></tr></thead>'
                + '<tbody>' + rows + '</tbody>'
                + '</table>'
                + '<p class="cart-total">Végösszeg: ' + formatPrice(total) + '</p>'
                + '<button class="btn-checkout" id="checkout-btn">Megrendelés</button>';

            document.querySelectorAll('.btn-remove').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    removeFromCart(btn.dataset.name);
                });
            });

            const checkoutBtn = document.getElementById('checkout-btn');
            if (checkoutBtn) {
                checkoutBtn.addEventListener('click', checkout);
            }
        }

        function checkout() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            if (cart.length === 0) return;
            window.location.href = 'checkout.php?cart=' + encodeURIComponent(JSON.stringify(cart));
        }

        renderCart();
    </script>
</body>

</html>
